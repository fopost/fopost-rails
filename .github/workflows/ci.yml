name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ruby ${{ matrix.ruby }} · rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        # Rails 8.0 requires Ruby 3.2 or newer; every other pair is supported.
        include:
          - { ruby: '3.1', rails: '7_0' }
          - { ruby: '3.2', rails: '7_0' }
          - { ruby: '3.3', rails: '7_0' }
          - { ruby: '3.4', rails: '7_0' }
          - { ruby: '3.1', rails: '7_1' }
          - { ruby: '3.2', rails: '7_1' }
          - { ruby: '3.3', rails: '7_1' }
          - { ruby: '3.4', rails: '7_1' }
          - { ruby: '3.1', rails: '7_2' }
          - { ruby: '3.2', rails: '7_2' }
          - { ruby: '3.3', rails: '7_2' }
          - { ruby: '3.4', rails: '7_2' }
          - { ruby: '3.2', rails: '8_0' }
          - { ruby: '3.3', rails: '8_0' }
          - { ruby: '3.4', rails: '8_0' }
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: bundle exec rubocop
